<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Froso Patsalou | Design Portfolio</title>
  <meta name="theme-color" content="#FF91DC">
  <link rel="icon" href="data:,">
  <link rel="preload" as="image" href="./assets/stickers/smiling-matched.webp" fetchpriority="high">
  <link rel="stylesheet" href="./styles/tokens.css?v=1">
  <link rel="stylesheet" href="./styles/base.css?v=1">
  <link rel="stylesheet" href="./styles/components.css?v=1">
  <link rel="stylesheet" href="./styles.css?v=5">
  <link rel="stylesheet" href="./styles/landing.css?v=1">
  <script src="./loader.js?v=5" defer></script>
</head>
<body class="is-loading">
  <div class="loader" id="loader" aria-label="Loading Froso's portfolio">
    <div class="loader__content">
      <div class="loader__sticker-stage" aria-hidden="true">
        <img class="loader__sticker" id="loader-sticker" src="./assets/stickers/smiling-matched.webp" alt="" width="720" height="606" fetchpriority="high" decoding="async">
      </div>
      <div class="loader__progress-row">
        <div class="loader__track" id="loading-progress" role="progressbar" aria-label="Loading portfolio" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="loader__fill" id="loading-fill"><span class="loader__sparkle" aria-hidden="true"></span></div>
        </div>
      </div>
      <span class="sr-only" role="status" id="loading-status">Loading portfolio</span>
    </div>
  </div>
  <main class="page-shell landing" id="portfolio" inert aria-hidden="true">
    <h1 class="sr-only">Froso Patsalou — Design portfolio</h1>
    <section class="desk" aria-label="A creative desk with colourful stationery on blue graph paper">
      <div class="desk__canvas" data-animation-frame="first" aria-hidden="true">
        <img class="desk__paper" src="./assets/desk/graph-paper.webp" alt="" width="2400" height="1411" decoding="async" fetchpriority="high">
        <img class="desk__item desk__scissors-top" data-object="scissors-top" src="./assets/desk/scissors.svg" alt="" decoding="async" draggable="false">
        <img class="desk__item desk__ruler-top" data-object="ruler-top" src="./assets/desk/ruler.svg" alt="" decoding="async" draggable="false">
        <img class="desk__item desk__clip-top-a" data-object="clip-top-a" src="./assets/desk/clip-magenta.svg" alt="" decoding="async" draggable="false">
        <img class="desk__item desk__clip-top-b" data-object="clip-top-b" src="./assets/desk/clip-magenta.svg" alt="" decoding="async" draggable="false">
        <img class="desk__item desk__clip-top-c" data-object="clip-top-c" src="./assets/desk/clip-magenta.svg" alt="" decoding="async" draggable="false">
        <img class="desk__item desk__notebooks" data-object="notebooks" src="./assets/desk/notebooks.svg" alt="" decoding="async" draggable="false">
        <img class="desk__item desk__pen" data-object="pen" src="./assets/desk/pen.svg" alt="" decoding="async" draggable="false">
        <img class="desk__item desk__clip-pink" data-object="clip-pink" src="./assets/desk/clip-pink.svg" alt="" decoding="async" draggable="false">
        <img class="desk__item desk__clip-lime" data-object="clip-lime" src="./assets/desk/clip-lime.svg" alt="" decoding="async" draggable="false">
        <img class="desk__item desk__clip-yellow" data-object="clip-yellow" src="./assets/desk/clip-yellow.svg" alt="" decoding="async" draggable="false">
        <img class="desk__item desk__clip-magenta" data-object="clip-magenta" src="./assets/desk/clip-magenta.svg" alt="" decoding="async" draggable="false">
        <img class="desk__item desk__stapler-yellow" data-object="stapler-yellow" src="./assets/desk/stapler.svg" alt="" decoding="async" draggable="false">
        <img class="desk__item desk__glue" data-object="glue" src="./assets/desk/glue.svg" alt="" decoding="async" draggable="false">
        <img class="desk__item desk__stapler-purple" data-object="stapler-purple" src="./assets/desk/stapler-purple.svg" alt="" decoding="async" draggable="false">
        <img class="desk__item desk__ruler-bottom" data-object="ruler-bottom" src="./assets/desk/ruler-purple.svg" alt="" decoding="async" draggable="false">
        <img class="desk__item desk__scissors-bottom" data-object="scissors-bottom" src="./assets/desk/scissors.svg" alt="" decoding="async" draggable="false">
      </div>
    </section>
  </main>
  <noscript><style>.loader{display:none}body{background:#fff}</style></noscript>
</body>
</html>
