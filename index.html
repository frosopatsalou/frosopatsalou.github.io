<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Froso Patsalou | Design Portfolio</title>
  <meta name="theme-color" content="#ffa3ca">
  <link rel="icon" href="data:,">
  <link rel="preload" as="image" href="./assets/stickers/smiling-clean.webp" fetchpriority="high">
  <link rel="stylesheet" href="./styles.css?v=2">
  <script src="./loader.js?v=2" defer></script>
</head>
<body class="is-loading">
  <div class="loader" id="loader" aria-label="Loading Froso's portfolio">
    <div class="loader__content">
      <div class="loader__sticker-stage" aria-hidden="true">
        <img class="loader__sticker" id="loader-sticker" src="./assets/stickers/smiling-clean.webp" alt="" width="720" height="606" fetchpriority="high" decoding="async">
      </div>
      <div class="loader__track" id="loading-progress" role="progressbar" aria-label="Loading portfolio" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="loader__fill" id="loading-fill"><span class="loader__sparkle" aria-hidden="true"></span></div>
      </div>
      <span class="sr-only" role="status" id="loading-status">Loading portfolio</span>
    </div>
  </div>
  <main id="portfolio" inert aria-hidden="true"></main>
  <noscript><style>.loader{display:none}body{background:#fff}</style></noscript>
</body>
</html>
