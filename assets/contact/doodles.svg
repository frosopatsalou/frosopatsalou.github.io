<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900"><style>
.doodle { transform-box: fill-box; transform-origin: center; animation-duration: var(--tempo,3.4s); animation-delay: var(--delay,0s); animation-iteration-count: infinite; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
.wiggle { animation-name: wiggle; }.pop { animation-name: pop; }.turn { animation-name: turn; }.bob { animation-name: bob; }
@keyframes wiggle { 0%,62%,100% { transform: rotate(0deg) translateY(0); } 70% { transform: rotate(-3deg) translateY(-2px); } 80% { transform: rotate(3deg) translateY(0); } 90% { transform: rotate(-1deg) translateY(-1px); } }
@keyframes pop { 0%,65%,100% { transform: scale(1) rotate(0deg); } 74% { transform: scale(1.08) rotate(-4deg); } 84% { transform: scale(.98) rotate(3deg); } 94% { transform: scale(1.02) rotate(0deg); } }
@keyframes turn { 0%,60%,100% { transform: rotate(0deg); } 70% { transform: rotate(-5deg); } 82% { transform: rotate(5deg); } 92% { transform: rotate(-1deg); } }
@keyframes bob { 0%,68%,100% { transform: translateY(0) scale(1); } 76% { transform: translateY(-3px) scale(1.12); } 87% { transform: translateY(1px) scale(.98); } }
@media (prefers-reduced-motion: reduce) { .doodle { animation: none; } }
